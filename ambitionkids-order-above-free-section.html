<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambition Kids Offer Section</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff7ef;
      padding: 24px 12px;
    }

    .ak-offer-wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    .ak-offer-board {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      padding: 14px 14px 40px;
      background:
        radial-gradient(circle at 12% 20%, rgba(255, 208, 86, 0.34), transparent 18%),
        radial-gradient(circle at 88% 22%, rgba(255, 208, 86, 0.26), transparent 18%),
        linear-gradient(180deg, #d62016 0%, #c81310 100%);
      border: 2px solid #ef6c5d;
      box-shadow: 0 12px 26px rgba(167, 18, 12, 0.22);
    }

    .ak-offer-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
    }

    .ak-offer-card {
      position: relative;
      text-align: center;
      color: #fff;
    }

    .ak-offer-ribbon {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(-14deg);
      background: linear-gradient(180deg, #ff6559 0%, #d51917 100%);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 4px 11px;
      border-radius: 999px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.18);
      text-transform: uppercase;
      z-index: 3;
    }

    .ak-offer-visual {
      position: relative;
      min-height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 8px 6px;
    }

    .ak-offer-visual::before {
      content: "";
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: 88px;
      height: 88px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 238, 140, 0.95) 0%, rgba(255, 212, 77, 0.65) 34%, rgba(255, 207, 80, 0.22) 58%, rgba(255, 207, 80, 0) 76%);
      filter: blur(2px);
    }

    .ak-offer-image {
      position: relative;
      z-index: 2;
      max-width: 74px;
      max-height: 82px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.28));
    }

    .ak-book-box {
      position: relative;
      z-index: 2;
      width: 86px;
      height: 98px;
      border-radius: 14px;
      background: linear-gradient(180deg, #ffe4a7 0%, #ffd16a 100%);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.22);
      border: 3px solid rgba(139, 39, 9, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ak-book-spine {
      width: 20px;
      height: 72px;
      border-radius: 6px 0 0 6px;
      background: linear-gradient(180deg, #43c04b 0%, #208a2b 100%);
      box-shadow: inset -2px 0 0 rgba(0, 0, 0, 0.14);
    }

    .ak-book-cover {
      width: 44px;
      height: 72px;
      margin-left: 2px;
      border-radius: 0 6px 6px 0;
      background: linear-gradient(180deg, #7be27f 0%, #32a73a 100%);
      box-shadow: inset -3px -4px 0 rgba(255, 255, 255, 0.14);
    }

    .ak-book-box--worksheets .ak-book-spine {
      background: linear-gradient(180deg, #4da7ff 0%, #2b67d8 100%);
    }

    .ak-book-box--worksheets .ak-book-cover {
      background: linear-gradient(180deg, #86c7ff 0%, #3f87f5 100%);
    }

    .ak-book-box--coloring .ak-book-spine {
      background: linear-gradient(180deg, #ff75ac 0%, #dd3977 100%);
    }

    .ak-book-box--coloring .ak-book-cover {
      background: linear-gradient(180deg, #ffb5d0 0%, #f45b92 100%);
    }

    .ak-offer-title {
      position: relative;
      z-index: 2;
      margin-top: 1px;
      color: #ffe35d;
      font-size: 18px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.16);
    }

    .ak-offer-subtitle {
      position: relative;
      z-index: 2;
      margin-top: 4px;
      color: #fff5d0;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .ak-price-badge {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 7px;
      min-width: 74px;
      min-height: 24px;
      padding: 3px 12px;
      border-radius: 999px;
      background: #ffffff;
      color: #111;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.18);
    }

    .ak-bottom-strip {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 10px 0;
      border-top: 2px dashed rgba(47, 0, 0, 0.5);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
    }

    .ak-bottom-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(180deg, #7d0002 0%, #98090b 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 5px 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    .ak-gift {
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
    }

    .ak-bottom-note {
      opacity: 0.95;
      letter-spacing: 0.02em;
      text-align: center;
    }

    @media (max-width: 640px) {
      body {
        padding: 8px 6px;
      }

      .ak-offer-wrap {
        max-width: 100%;
      }

      .ak-offer-board {
        border-radius: 12px;
        padding: 10px 6px 45px;
      }

      .ak-offer-grid {
        gap: 4px;
      }

      .ak-offer-visual {
        min-height: 72px;
        padding: 6px 4px 2px;
      }

      .ak-offer-visual::before {
        width: 58px;
        height: 58px;
        bottom: 8px;
      }

      .ak-offer-ribbon {
        top: 0;
        font-size: 8px;
        padding: 3px 8px;
      }

      .ak-book-box {
        width: 58px;
        height: 68px;
        border-radius: 10px;
        border-width: 2px;
      }

      .ak-book-spine {
        width: 13px;
        height: 48px;
        border-radius: 4px 0 0 4px;
      }

      .ak-book-cover {
        width: 29px;
        height: 48px;
        margin-left: 1px;
        border-radius: 0 4px 4px 0;
      }

      .ak-offer-title {
        font-size: 10px;
        margin-top: 0;
        line-height: 2;
      }

      .ak-offer-subtitle {
             margin-top: 2px;
        font-size: 9px;
        letter-spacing: 0.03em;
        line-height: 1.2;

      }

      .ak-price-badge {
        min-width: 52px;
        min-height: 20px;
        margin-top: 5px;
        padding: 2px 8px;
        font-size: 11px;
      }

      .ak-bottom-strip {
        left: 8px;
        right: 8px;
        bottom: 6px;
        gap: 4px;
        padding-top: 6px;
        font-size: 8px;
      }

      .ak-bottom-pill {
        gap: 4px;
        padding: 4px 8px;
      }

      .ak-gift {
        font-size: 9px;
      }

      .ak-bottom-note {
        font-size: 8px;
      }
      .ak-bottom-strip{
        padding:15px 0px 0;
      }
    }
  </style>
</head>
<body>
  <div class="ak-offer-wrap">
    <section class="ak-offer-board">
      <div class="ak-offer-grid">
        <article class="ak-offer-card">
          <div class="ak-offer-ribbon">Free</div>
          <div class="ak-offer-visual">
            <div class="ak-book-box">
              <div class="ak-book-spine"></div>
              <div class="ak-book-cover"></div>
            </div>
          </div>
          <div class="ak-offer-title">Brain Booster</div>
          <div class="ak-offer-subtitle">Free Book</div>
          <div class="ak-price-badge">&#8377;999</div>
        </article>

        <article class="ak-offer-card">
          <div class="ak-offer-ribbon">Free</div>
          <div class="ak-offer-visual">
            <div class="ak-book-box ak-book-box--worksheets">
              <div class="ak-book-spine"></div>
              <div class="ak-book-cover"></div>
            </div>
          </div>
          <div class="ak-offer-title">200+ Worksheets</div>
          <div class="ak-offer-subtitle">Free Book</div>
          <div class="ak-price-badge">&#8377;1499</div>
        </article>

        <article class="ak-offer-card">
          <div class="ak-offer-ribbon">Free</div>
          <div class="ak-offer-visual">
            <div class="ak-book-box ak-book-box--coloring">
              <div class="ak-book-spine"></div>
              <div class="ak-book-cover"></div>
            </div>
          </div>
          <div class="ak-offer-title">Colouring Book</div>
          <div class="ak-offer-subtitle">Free Book</div>
          <div class="ak-price-badge">&#8377;1899</div>
        </article>
      </div>

      <div class="ak-bottom-strip">
        <div class="ak-bottom-pill">
          <!-- <span class="ak-gift">Gift</span> -->
          <span> Gift Free Books On Eligible Orders</span>
        </div>
        <div class="ak-bottom-note">(Starts from order above &#8377;999)</div>
      </div>
    </section>
  </div>
</body>
</html>
