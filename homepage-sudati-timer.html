<style>

    @font-face {
            font-family: 'Cinzel Custom';
            src: url('https://cdn.shopify.com/s/files/1/0818/7107/7663/files/Cinzel-VariableFont_wght.ttf') format('truetype');
            font-weight: 400 900;
            font-style: normal;
        }

    .suddati-home-timer,
    .suddati-home-timer * {
        box-sizing: border-box;
    }

    .suddati-home-timer {
        width: 100%;
        font-family: 'Cinzel Custom', serif;
    }

    .suddati-home-timer .timer-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        padding: 14px 18px;
        border: 1px solid rgba(244, 221, 176, 0.32);
        border-radius: 6px;
        background:
            linear-gradient(180deg, rgba(31, 0, 2, 0.28), rgba(31, 0, 2, 0.42)),
            url('https://cdn.shopify.com/s/files/1/0818/7107/7663/files/Bg.png?v=1778589583');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
        color: #f4ddb0;
    }

    .suddati-home-timer .timer-text {
        margin: 0;
        color: #ffe5a2;
        font-size: 18px ;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
        text-transform: uppercase;
        white-space: nowrap;
        flex: 0 0 auto;
    }

    .suddati-home-timer .timer-values {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        white-space: nowrap;
        flex: 0 0 auto;
    }

    .suddati-home-timer .timer-unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }

    .suddati-home-timer .timer-box {
        min-width: 48px;
        padding: 8px 7px;
        border: 1px solid rgba(255, 229, 162, 0.36);
        border-radius: 6px;
        background: rgba(255, 229, 162, 0.1);
        color: #ffe5a2;
        font-size: 24px ;
        font-weight: 700;
        line-height: 1;
        text-align: center;
    }

    .suddati-home-timer .timer-label {
        color: #f4ddb0;
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .suddati-home-timer .timer-separator {
        color: #ffe5a2;
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
    }


    @media(max-width: 767px){
        .suddati-home-timer .timer-bar{padding:8px 10px; gap:12px; border-radius:0;}
        .suddati-home-timer .timer-text{font-size:16px;}
        .suddati-home-timer .timer-box{font-size:18px; min-width:42px; padding:6px;}
        .suddati-home-timer .timer-label{font-size:9px; letter-spacing:0.08em;}
    }
</style>

<div class="suddati-home-timer">
    <div class="timer-bar">
        <p class="timer-text">Unlocking in:</p>
        <div class="timer-values" aria-label="Countdown timer">
            <span class="timer-unit">
                <span class="timer-box" id="hour">00</span>
                <span class="timer-label">HRS</span>
            </span>
            <span class="timer-separator">:</span>
            <span class="timer-unit">
                <span class="timer-box" id="minute">00</span>
                <span class="timer-label">MIN</span>
            </span>
            <span class="timer-separator">:</span>
            <span class="timer-unit">
                <span class="timer-box" id="second">00</span>
                <span class="timer-label">SEC</span>
            </span>
        </div>
    </div>
</div>

<script>
    function start24HrISTCountdown() {
        const hourEl = document.getElementById('hour');
        const minuteEl = document.getElementById('minute');
        const secondEl = document.getElementById('second');

        function updateCountdown() {
            const now = new Date();
            const nowIST = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
            const nextMidnightIST = new Date(nowIST);
            nextMidnightIST.setHours(24, 0, 0, 0);

            const diff = nextMidnightIST.getTime() - nowIST.getTime();

            if (diff <= 0) {
                hourEl.textContent = '00';
                minuteEl.textContent = '00';
                secondEl.textContent = '00';
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            hourEl.textContent = String(hours).padStart(2, '0');
            minuteEl.textContent = String(minutes).padStart(2, '0');
            secondEl.textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    }

    start24HrISTCountdown();
</script>
