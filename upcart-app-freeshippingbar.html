<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Progress Bar</title>
    <style>
   

  
        .shipping-progress {
            width: min(100%, 380px);
            padding: 18px 18px 18px 16px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.14);
        }

        .shipping-progress__top {
            display: block;
        }

        .shipping-progress__bar {
            width: 100%;
            height: 10px;
            margin-bottom: 14px;
            border-radius: 999px;
            overflow: visible;
            background: #d6dde7;
        }

        .shipping-progress__fill {
            position: relative;
            width: 81%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2fb300 0%, #41c500 100%);
        }

        .shipping-progress__fill-icon {
            position: absolute;
            top: 50%;
            right: -8px;
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            transform: translateY(-50%);
            background: #1458bf;
            color: #fff;
            box-shadow: 0 6px 16px rgba(20, 88, 191, 0.3);
        }

        .shipping-progress__text {
            margin: 0;
            color: #445066;
            font-size: 15px;
            line-height: 1.25;
        }

        .shipping-progress__text strong {
            display: block;
            margin-top: 3px;
            color: #1e293b;
            font-size: 17px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
    </style>
</head>

<body>
    <div class="shipping-progress" aria-label="Free shipping progress">
        <div class="shipping-progress__top">
            <div class="shipping-progress__bar" aria-hidden="true">
                <div class="shipping-progress__fill">
                    <span class="shipping-progress__fill-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path
                                d="M3.5 6.5H13.5V16.5H3.5V6.5ZM13.5 9H17.2L20.5 12.5V16.5H13.5V9ZM7 18.2C7 19.19 6.19 20 5.2 20C4.21 20 3.4 19.19 3.4 18.2C3.4 17.21 4.21 16.4 5.2 16.4C6.19 16.4 7 17.21 7 18.2ZM18.6 18.2C18.6 19.19 17.79 20 16.8 20C15.81 20 15 19.19 15 18.2C15 17.21 15.81 16.4 16.8 16.4C17.79 16.4 18.6 17.21 18.6 18.2Z"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </span>
                </div>
            </div>
            <p class="shipping-progress__text">
                You got Free Shipping
            </p>
        </div>
    </div>
</body>

</html>
