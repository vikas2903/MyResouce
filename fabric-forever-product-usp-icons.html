<section class="trust-info-strip">
  <style>
    .trust-info-strip {
      padding: 20px 16px;
      background: #fff;
      border-top: 1px solid #e9e3d9;
      border-bottom: 1px solid #e9e3d9;
      font-family: Gotham, Arial, sans-serif;
    }

    .trust-info-strip__grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 20px;
    }

    .trust-info-strip__item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #111111;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 400;
    }

    .trust-info-strip__icon {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #6b746d;
    }

    .trust-info-strip__icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media screen and (min-width: 990px) {
      .trust-info-strip {
        padding: 22px 24px;
      }

      .trust-info-strip__grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px 32px;
      }

      .trust-info-strip__item {
        font-size: 15px;
      }
    }
  </style>

  <div class="trust-info-strip__grid">
    <div class="trust-info-strip__item">
      <span class="trust-info-strip__icon" aria-hidden="true">

          <path d="M16 9.4v7l4.7 2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M26.4 5.6v5.3h-5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>24 Hour Dispatch</span>
    </div>

    <div class="trust-info-strip__item">
      <span class="trust-info-strip__icon" aria-hidden="true">

          <path d="M27 10.5v8.7c0 4.7-5 8-11 9.8-6-1.8-11-5.1-11-9.8v-8.7l11-3.5 11 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
