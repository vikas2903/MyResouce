<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f9fafb;
        }

        .search-container {
            display: flex;
            width: 80%;
            max-width: 600px;
        }

        .search-input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: none;
            border-radius: 30px 0 0 30px;
            outline: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .search-btn {
            padding: 0 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 0 30px 30px 0;
            background: #2563eb;
            /* bright blue */
            color: white;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Enter your search query...">
        <button class="search-btn" id="searchBtn">Search</button>
    </div>

    </form>

   <script>

const suggestions = [
    "Search 5000+ Fabrics",
    "Search By Work Type",
    "Search By SKU",
    "Search By Color",
    "Search By Occasion",
    "Search Suits",
    "Search Lehenga",
    "Search Summer Fabrics",
    "Search Dupatta",
    "Search Men’s Fabric"
];
const input = document.getElementById("searchInput");
// const input = document.querySelector(".site-header__search-input");

let suggestionIndex = 0;
let charIndex = 0;
let isDeleting = false;
let isFocused = false;

// Pause animation when user focuses input
input.addEventListener("focus", () => isFocused = true);
input.addEventListener("blur", () => isFocused = false);

function typeEffect() {
    if (isFocused) {
        setTimeout(typeEffect, 500);
        return;
    }

    const currentText = suggestions[suggestionIndex];

    if (isDeleting) {
        charIndex--;
    } else {
        charIndex++;
    }

    input.placeholder = currentText.substring(0, charIndex);

    let speed = isDeleting ? 40 : 80;

    if (!isDeleting && charIndex === currentText.length) {
        speed = 1200; // pause at full text
        isDeleting = true;
    } 
    else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        suggestionIndex = (suggestionIndex + 1) % suggestions.length;
        speed = 400;
    }

    setTimeout(typeEffect, speed);
}

typeEffect();
</script>

</body>

</html>
