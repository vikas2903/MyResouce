<style>
  .made-right-section {
    --made-right-surface: #181e19;
    --made-right-ink: #E8E3D6;
    --made-right-gap: clamp(26px, 5vw, 92px);
    background: var(--made-right-surface);
    color: var(--made-right-ink);
    overflow: hidden;
  }

  .made-right-section__grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    min-height: min(52vw, 900px);
  }

  .made-right-section__media {
    position: relative;
    min-height: 620px;
    overflow: hidden;
  }

  .made-right-section__media::after {
    background: linear-gradient(90deg, rgba(184, 188, 185, 0) 52%, var(--made-right-surface) 100%);
    content: '';
    inset: 0;
    pointer-events: none;
    position: absolute;
    z-index: 1;
  }

  .made-right-section__video {
    display: block;
    height: 100%;
    object-fit: cover;
    object-position: center;
    position: absolute;
    width: 100%;
  }

  .made-right-section__content {
    align-items: flex-start;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--made-right-ink);
    padding: clamp(64px, 11vw, 178px) var(--made-right-gap) clamp(62px, 7vw, 112px);
  }

  .made-right-section__eyebrow {
    color: #34322f;
    font-family: Jost, Arial, sans-serif;
    font-size: clamp(14px, 1.2vw, 19px);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 clamp(30px, 3.5vw, 52px);
    color: var(--made-right-ink);
  }

  .made-right-section__title {
    color: var(--made-right-ink);
    font-family: Cinzel, Georgia, serif;
    font-size: clamp(32px, 3.1vw, 51px);
    font-weight: 400;
    letter-spacing: -0.035em;
    line-height: 1.42;
    margin: 0;
    max-width: 620px;
  }

  .made-right-section__marquee {
    margin-top: clamp(55px, 8vw, 128px);
    max-width: 650px;
    overflow: hidden;
    width: 100%;
  }

  .made-right-section__marquee-track {
    align-items: center;
    animation: made-right-marquee 18s linear infinite;
    display: flex;
    gap: clamp(34px, 4vw, 72px);
    width: max-content;
  }

  .made-right-section__logo {
    display: block;
    flex: 0 0 auto;
    height: clamp(58px, 5.2vw, 85px);
    object-fit: contain;
    opacity: 0.74;
    width: auto;
    filter: invert(1);
  }

  @keyframes made-right-marquee {
    to {
      transform: translateX(calc(-50% - (clamp(34px, 4vw, 72px) / 2)));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .made-right-section__marquee-track {
      animation-play-state: paused;
    }
  }

  @media (max-width: 749px) {
    .made-right-section__grid {
      grid-template-columns: 1fr;
      min-height: 0;
    }

    .made-right-section__media {
      min-height: 72vw;
    }

    .made-right-section__media::after {
      background: linear-gradient(180deg, rgba(184, 188, 185, 0) 50%, var(--made-right-surface) 100%);
    }

    .made-right-section__content {
      padding: 46px 24px 54px;
    }

    .made-right-section__eyebrow {
      margin-bottom: 22px;
    }

    .made-right-section__title {
      font-size: clamp(29px, 8.5vw, 40px);
      line-height: 1.32;
    }

    .made-right-section__marquee {
      margin-top: 48px;
    }
  }
</style>

<section class="made-right-section" aria-labelledby="made-right-heading">
  <div class="made-right-section__grid">
    <div class="made-right-section__media">
      <video class="made-right-section__video" autoplay muted loop playsinline preload="metadata" aria-label="Made Right manufacturing process">
        <source src="https://cdn.shopify.com/videos/c/o/v/4d7428467d5842c293cbd54af6449e6e.mp4" type="video/mp4">
      </video>
    </div>

    <div class="made-right-section__content">
      <p class="made-right-section__eyebrow">Made Right</p>
      <h2 class="made-right-section__title" id="made-right-heading">We put patience, precision and a lot of care into every tee. Doing it right is a reward in itself.</h2>

      <div class="made-right-section__marquee" aria-label="Our certifications">
        <div class="made-right-section__marquee-track">
          <img class="made-right-section__logo" src="https://www.marchtee.com/assets/core/static/images/thumbnails/mdm-thumbnails/certification.png?v=11533" alt="Certification">
          <img class="made-right-section__logo" src="https://www.marchtee.com/assets/core/static/images/thumbnails/mdm-thumbnails/certification.png?v=11533" alt="Certification">
          <img class="made-right-section__logo" src="https://www.marchtee.com/assets/core/static/images/thumbnails/mdm-thumbnails/certification.png?v=11533" alt="Certification">
          <img class="made-right-section__logo" src="https://www.marchtee.com/assets/core/static/images/thumbnails/mdm-thumbnails/certification.png?v=11533" alt="" aria-hidden="true">
          <img class="made-right-section__logo" src="https://www.marchtee.com/assets/core/static/images/thumbnails/mdm-thumbnails/certification.png?v=11533" alt="" aria-hidden="true">
          <img class="made-right-section__logo" src="https://www.marchtee.com/assets/core/static/images/thumbnails/mdm-thumbnails/certification.png?v=11533" alt="" aria-hidden="true">
        </div>
      </div>
    </div>
  </div>
</section>
