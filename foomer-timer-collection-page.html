<script>
  (function () {
    const second = 1000;
    const minute = second * 60;
    const hour = minute * 60;

    function getNextMidnight() {
      const now = new Date();
      const midnight = new Date(now);
      midnight.setHours(24, 0, 0, 0);
      return midnight.getTime();
    }

    function initTimer() {
      const wrapper = document.querySelector(
        ".countdown-timer-sections--20543446286588__ss_countdown_bar_Wx9cyT-timer_7t4WyV"
      );
      if (!wrapper) return false;

      let targetTime = getNextMidnight();

      function updateTimer() {
        const now = Date.now();
        let remaining = targetTime - now;

        if (remaining <= 0) {
          targetTime = getNextMidnight();
          remaining = targetTime - now;
        }

        const totalHours = Math.floor(remaining / hour);
        const minutes = Math.floor((remaining % hour) / minute);
        const seconds = Math.floor((remaining % minute) / second);

        wrapper.querySelector(".js-timer-hours").textContent = String(
          totalHours
        ).padStart(2, "0");
        wrapper.querySelector(".js-timer-minutes").textContent = String(
          minutes
        ).padStart(2, "0");
        wrapper.querySelector(".js-timer-seconds").textContent = String(
          seconds
        ).padStart(2, "0");

        const drift = second - (Date.now() % second);
        setTimeout(updateTimer, drift);
      }

      updateTimer();
      return true;
    }

    let attempts = 0;
    const retry = setInterval(() => {
      attempts++;
      if (initTimer() || attempts > 20) clearInterval(retry);
    }, 200);
  })();
</script>
