<!-- Progress Bar UI -->
<style>
  .sudati-cart-offer-progress {
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: flex-end;
    align-items: stretch;
    text-align: center;
    border: 1px dashed rgba(9, 49, 116, 0.5);
    border-radius: 12px;
    padding: 10px 12px 24px !important;
    margin-bottom: 12px;
    background-size: cover;
    background: linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
  }

  .sudati-cart-offer-progress__bar {
    display: block !important;
    position: relative;
    min-width: 0;
    transition: width 0.3s ease;
  }

  .sudati-cart-offer-progress__bar::before {
    content: "";
    position: absolute;
    top: -3px;
    right: -8px;
    width: 12px;
    height: 12px;
    background: #093174;
    border-radius: 50%;
    box-shadow: 0 0 0 3px #ffffff;
  }

  .sudati-cart-offer-progress__copy {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
  }

  .sudati-cart-offer-progress__title {
    margin: 0;
    color: #093174;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .sudati-cart-offer-progress__message {
    flex: 1;
    margin: 0;
    text-align: right;
    font-size: 11px;
    line-height: 1.3;
    color: #1d2e52;
    letter-spacing: 0;
  }

  .sudati-cart-offer-progress__track {
    position: relative;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(204, 170, 71, 0.2);
    overflow: visible;
  }

  .sudati-cart-offer-progress__icon {
    position: absolute;
    top: -8px;
    width: 24px;
    height: 24px;
    padding: 2px;
    border: 1px solid #093174;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 12px rgba(9, 49, 116, 0.1);
  }

  .sudati-cart-offer-progress__icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .sudati-cart-offer-progress__icon--1 {
    left: 26%;
  }

  .sudati-cart-offer-progress__icon--2 {
    left: 61%;
  }

  .sudati-cart-offer-progress__icon--3 {
    right: 0;
  }

  @media (max-width: 768px) {
    .sudati-cart-offer-progress {
      gap: 6px;
      padding: 8px 10px 20px !important;
      border-radius: 10px;
    }

    .sudati-cart-offer-progress__copy {
      gap: 6px;
    }

    .sudati-cart-offer-progress__track {
      height: 5px;
    }

    .sudati-cart-offer-progress__title {
      font-size: 11px;
      letter-spacing: 0.03em;
    }

    .sudati-cart-offer-progress__message {
      font-size: 10px;
    }

    .sudati-cart-offer-progress__icon {
      top: -7px;
      width: 21px;
      height: 21px;
    }

    .sudati-cart-offer-progress__icon--1 {
      left: 24%;
    }

    .sudati-cart-offer-progress__icon--2 {
      left: 59%;
    }
  }

  @media (max-width: 480px) {
    .sudati-cart-offer-progress__copy {
      flex-direction: column;
      align-items: center;
    }

    .sudati-cart-offer-progress__message {
      text-align: center;
    }
  }
</style>

<div class="sudati-cart-offer-progress">
  <div class="sudati-cart-offer-progress__copy">
    <div class="sudati-cart-offer-progress__title">BUY 2 GET 1 FREE</div>
    <p class="sudati-cart-offer-progress__message">Add 3 products to unlock the offer!</p>
  </div>

  <div class="sudati-cart-offer-progress__track">
    <div class="sudati-cart-offer-progress__bar" style="width: 0%; height: 100%; background: #093174; border-radius: 999px;"></div>

    <span class="sudati-cart-offer-progress__icon sudati-cart-offer-progress__icon--1" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 8.3c-.9-1.7-2.1-2.8-3.7-2.8-1.4 0-2.4 1-2.4 2.2 0 1.3 1.1 2.3 2.8 2.3H12V8.3Z" fill="#093174"/>
        <path d="M12 8.3c.9-1.7 2.1-2.8 3.7-2.8 1.4 0 2.4 1 2.4 2.2 0 1.3-1.1 2.3-2.8 2.3H12V8.3Z" fill="#093174"/>
        <path d="M5 10h14v3H5z" fill="#093174"/>
        <path d="M6 13h12v6H6z" fill="#093174"/>
        <path d="M11 10h2v9h-2z" fill="#ffffff"/>
      </svg>
    </span>

    <span class="sudati-cart-offer-progress__icon sudati-cart-offer-progress__icon--2" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 8.3c-.9-1.7-2.1-2.8-3.7-2.8-1.4 0-2.4 1-2.4 2.2 0 1.3 1.1 2.3 2.8 2.3H12V8.3Z" fill="#093174"/>
        <path d="M12 8.3c.9-1.7 2.1-2.8 3.7-2.8 1.4 0 2.4 1 2.4 2.2 0 1.3-1.1 2.3-2.8 2.3H12V8.3Z" fill="#093174"/>
        <path d="M5 10h14v3H5z" fill="#093174"/>
        <path d="M6 13h12v6H6z" fill="#093174"/>
        <path d="M11 10h2v9h-2z" fill="#ffffff"/>
      </svg>
    </span>

    <span class="sudati-cart-offer-progress__icon sudati-cart-offer-progress__icon--3" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 8.3c-.9-1.7-2.1-2.8-3.7-2.8-1.4 0-2.4 1-2.4 2.2 0 1.3 1.1 2.3 2.8 2.3H12V8.3Z" fill="#093174"/>
        <path d="M12 8.3c.9-1.7 2.1-2.8 3.7-2.8 1.4 0 2.4 1 2.4 2.2 0 1.3-1.1 2.3-2.8 2.3H12V8.3Z" fill="#093174"/>
        <path d="M5 10h14v3H5z" fill="#093174"/>
        <path d="M6 13h12v6H6z" fill="#093174"/>
        <path d="M11 10h2v9h-2z" fill="#ffffff"/>
      </svg>
    </span>
  </div>
</div>

<script>
  (function () {
    function getProgressBlocks() {
      return Array.from(document.querySelectorAll(".sudati-cart-offer-progress"));
    }

    function getMessageForCount(totalItems) {
      if (totalItems === 0) {
        return "Add 3 products to unlock the offer!";
      }

      if (totalItems === 1) {
        return "Add 2 more products to unlock the offer!";
      }

      if (totalItems === 2) {
        return "Add 1 more product to unlock the offer!";
      }

      return "Congratulations! You've unlocked the offer!";
    }

    function renderProgress(cart) {
      const totalItems = cart && typeof cart.item_count === "number" ? cart.item_count : 0;
      const progress = Math.min((totalItems / 3) * 100, 100);
      const blocks = getProgressBlocks();

      blocks.forEach((block) => {
        const progressBar = block.querySelector(".sudati-cart-offer-progress__bar");
        const message = block.querySelector(".sudati-cart-offer-progress__message");

        if (!progressBar || !message) {
          return;
        }

        block.style.display = "flex";
        progressBar.style.width = progress + "%";
        message.textContent = getMessageForCount(totalItems);
      });
    }

    function updateProgressBar() {
      return fetch("/cart.js", { credentials: "same-origin" })
        .then((response) => response.json())
        .then((cart) => {
          renderProgress(cart);
          return cart;
        })
        .catch((error) => {
          console.error("Progress bar cart fetch error:", error);
        });
    }

    function openPremiumDrawer() {
      setTimeout(() => {
        if (window.CartDrawerPremium?.open) {
          window.CartDrawerPremium.open();
        }
      }, 300);
    }

    function getRequestUrl(input) {
      if (typeof input === "string") {
        return input;
      }

      if (input && typeof input.url === "string") {
        return input.url;
      }

      return "";
    }

    function isCartRequest(url) {
      return typeof url === "string" && (
        url.includes("/cart/add.js") ||
        url.includes("/cart/update.js") ||
        url.includes("/cart/change.js") ||
        url.includes("/cart/clear.js")
      );
    }

    function handleCartMutation(openDrawer) {
      updateProgressBar().then(() => {
        document.dispatchEvent(new CustomEvent("cart:updated:progress"));
        if (openDrawer) {
          openPremiumDrawer();
        }
      });
    }

    function monitorCartChanges() {
      if (!window.__sudatiCartProgressFetchHooked) {
        const originalFetch = window.fetch;

        window.fetch = function (...args) {
          const requestUrl = getRequestUrl(args[0]);

          return originalFetch.apply(this, args).then((response) => {
            if (isCartRequest(requestUrl) && response.ok) {
              handleCartMutation(true);
            }

            return response;
          });
        };

        window.__sudatiCartProgressFetchHooked = true;
      }

      if (!window.__sudatiCartProgressXhrHooked) {
        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSend = XMLHttpRequest.prototype.send;

        XMLHttpRequest.prototype.open = function (method, url) {
          this.__sudatiCartRequestUrl = url;
          return originalOpen.apply(this, arguments);
        };

        XMLHttpRequest.prototype.send = function () {
          this.addEventListener("load", function () {
            if (this.status >= 200 && this.status < 300 && isCartRequest(this.__sudatiCartRequestUrl || "")) {
              handleCartMutation(true);
            }
          });

          return originalSend.apply(this, arguments);
        };

        window.__sudatiCartProgressXhrHooked = true;
      }
    }

    function initSudatiCartProgress() {
      if (!getProgressBlocks().length) {
        return;
      }

      updateProgressBar();
      monitorCartChanges();

      document.addEventListener("cart:updated", function () {
        handleCartMutation(false);
      });

      document.addEventListener("cart:refresh", function () {
        handleCartMutation(false);
      });

      const cartDrawer = document.getElementById("CartDrawer");
      if (cartDrawer && !cartDrawer.__sudatiProgressObserved) {
        const observer = new MutationObserver(() => {
          updateProgressBar();
        });

        observer.observe(cartDrawer, { childList: true, subtree: true });
        cartDrawer.__sudatiProgressObserved = true;
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initSudatiCartProgress);
    } else {
      initSudatiCartProgress();
    }
  })();
</script>
