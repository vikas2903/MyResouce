<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        :root {
            color-scheme: light;
        }

        .offer-popup-wrapper {
            margin: 0;
            box-sizing: border-box;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(24, 18, 38, .72);
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            bottom: 0;
            top: 0;
            left: 0;
            right: 0;
            height: 100vh;
            z-index: 99;
        }

        .offer-popup {
            position: relative;
            width: min(100%, 375px);
            overflow: hidden;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 22px 60px rgba(0, 0, 0, .3);
            text-align: center;
        }

        .offer-popup__image {
            display: block;
            width: 100%;
            height: auto;
        }

        .offer-popup__content {
            padding: 9px 9px 19px;
        }

        .offer-popup h1 {
            margin: 0 0 8px;
            color: #25213b;
            font-size: clamp(1.5rem, 5vw, .7rem);
            line-height: 1.15;
        }

        .offer-popup p {
            margin: 0 0 12px;
            color: #615d70;
            line-height: 1.5;
            font-size: 14px;
        }

        .copy-code {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px 18px;
            background: #ff5b73;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .04em;
            transition: transform .18s ease, background .18s ease;
        }

        .copy-code:hover {
            background: #ed4661;
            transform: translateY(-2px);
        }

        .copy-code:focus-visible {
            outline: 3px solid #25213b;
            outline-offset: 3px;
        }

        .popup-close {
            position: absolute;
            top: 12px;
            right: 12px;
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, .9);
            color: #25213b;
            cursor: pointer;
            font-size: 24px;
            line-height: 1;
        }
    </style>
</head>

<body>

    <div class="offer-popup-wrapper">
        <section class="offer-popup" id="offerPopup" role="dialog" aria-modal="true" aria-labelledby="offerTitle">
            <button class="popup-close" type="button" aria-label="Close offer">&times;</button>
            <img class="offer-popup__image"
                src="https://cdn.shopify.com/s/files/1/0687/7144/7012/files/ChatGPT_Image_Aug_4_2026_10_24_26_AM.png?v=1785819483"
                alt="Ambition Kids special offer">
            <div class="offer-popup__content">
                <h1 id="offerTitle">A special treat for little achievers!</h1>
                <p>Use this exclusive code to save on your next order.</p>
                <button class="copy-code" id="copyCode" type="button">Copy code: KIDS50</button>
            </div>
        </section>
    </div>

    <script>
        const code = 'KIDS50';
        const copyButton = document.getElementById('copyCode');
        const closeButton = document.querySelector('.popup-close');
        const overlay = document.querySelector('.offer-popup-wrapper');
        document.getElementById('offerPopup').hidden = true;
        overlay.style.display = 'none';


        if (sessionStorage.getItem('ambitionKidsPopupClosed') !== 'true') {
            setTimeout(() => {
                document.getElementById('offerPopup').hidden = false;
                document.querySelector('.offer-popup-wrapper').style.display = 'grid';
                overlay.style.display = 'block';
            }, 2000);

        }

        if (sessionStorage.getItem('ambitionKidsPopupClosed') === 'true') {
            document.getElementById('offerPopup').hidden = true;
            overlay.style.display = 'none';
        }

        closeButton.addEventListener('click', () => {
            document.getElementById('offerPopup').hidden = true;
            sessionStorage.setItem('ambitionKidsPopupClosed', 'true');
            overlay.style.display = 'none';
        });

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(code);
            } catch (error) {
                const input = document.createElement('textarea');
                input.value = code;
                input.setAttribute('readonly', '');
                input.style.position = 'fixed';
                input.style.opacity = '0';
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                input.remove();
            }

            copyButton.textContent = 'Code copied!';
            setTimeout(() => {
                copyButton.textContent = `Copy code: ${code}`;
            }, 2000);
        });
    </script>


</body>

</html>
